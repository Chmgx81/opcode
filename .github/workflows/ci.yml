name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build ./cmd/tilde
      # TUI/UX spec 1.3: the headless path never imports the TUI stack.
      - name: headless must not import the TUI stack
        run: if go list -deps ./internal/headless | grep -qE 'internal/tui|bubbletea|lipgloss'; then echo "headless imports the TUI stack" && exit 1; fi
