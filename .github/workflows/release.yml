name: release

# Push a tag vX.Y.Z (or vX.Y.Z-rc.1 for a prerelease) to cut a release.
# See docs/releasing.md.
on:
  push:
    tags: ["v*"]

# Two pushes of the same tag must not race each other; a release run is
# never cancelled half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default is read-only; only the publish job gets write access.
permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  # The release gate: tag-format check plus vet and the race suite.
  # CI additionally runs gofmt, tidy drift, cross-builds, installer
  # tests, and govulncheck — tag from a green main, don't rely on
  # this job alone. Nothing is built or published unless this passes.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: tag must be vMAJOR.MINOR.PATCH[-prerelease]
        env:
          TAG: ${{ github.ref_name }}
        run: |
          num='(0|[1-9][0-9]*)'
          ident='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          re="^v${num}\.${num}\.${num}(-${ident}(\.${ident})*)?\$"
          if ! [[ "$TAG" =~ $re ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease] (e.g. v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${platform%/*}"; arch="${platform#*/}"
            name="tilde-${os}-${arch}"
            if [ "$os" = "windows" ]; then name="${name}.exe"; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath -ldflags="-s -w -X main.version=${TAG}" \
              -o "dist/${name}" ./cmd/tilde
            if [ "$os" = "windows" ]; then
              (cd dist && zip -q "${name%.exe}.zip" "${name}" && rm "${name}")
            else
              (cd dist && tar czf "${name}.tar.gz" "${name}" && rm "${name}")
            fi
          done
          ls -l dist
      - name: Checksums
        run: |
          set -eu
          cd dist
          # One file covering every archive: the installer and
          # `tilde update` fetch it and refuse a binary that does not match.
          sha256sum -- *.tar.gz *.zip > checksums.txt
          cat checksums.txt
          test "$(wc -l < checksums.txt)" -eq 5
          sha256sum -c checksums.txt
      # Run the archive we are about to ship, not the build tree's binary.
      - name: Smoke test linux-amd64 archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          tmp="$(mktemp -d)"
          tar -xzf dist/tilde-linux-amd64.tar.gz -C "$tmp"
          out="$("$tmp/tilde-linux-amd64" --version)"
          echo "--version printed: $out"
          case "$out" in
            *"$TAG"*) ;;
            *) echo "::error::--version output does not contain the tag $TAG"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Re-running is safe: if the release already exists its assets are
      # replaced in place instead of failing on "already exists". The
      # tag is validated as semver in `verify`, so a hyphen means a
      # prerelease (GitHub never treats those as `latest`).
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in *-*) pre=true ;; *) pre=false ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --generate-notes --title "$TAG" --prerelease="$pre"
          fi
